# Local preview: docker compose up --build, then open http://localhost:4000
services:
  site:
    build: .
    image: professorshroom-site
    # Run as your user so nothing in the project folder ends up owned by root
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      # :z relabels the folder for SELinux (Fedora) so the container can read it
      - .:/srv/jekyll:z
    environment:
      JEKYLL_ENV: development
      HOME: /tmp
    # Bypasses bin/entry_point.sh, which deletes Gemfile.lock when it isn't tracked by git
    command: >
      bundle exec jekyll serve --host 0.0.0.0 --port 4000
      --livereload --force_polling
      --destination /tmp/site --disable-disk-cache
