name: Sync NorthPoint README

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Download README as UTF-8 and extract changelog
        run: |
          curl -L https://raw.githubusercontent.com/ProfessorShroom/NorthPoint-Installer/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk '/^Changelog/{flag=1; next} flag' \
            | awk 'BEGIN{RS=""; ORS="\n\n"} {gsub(/\n/," "); print}' \
            > _includes/plutopoint-readme.md

      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add _includes/plutopoint-readme.md

          if ! git diff --cached --quiet; then
            # Force page rebuild by touching the page that includes the README
            touch _projects/NorthPoint_Installer.md
            git add _projects/NorthPoint_Installer.md
            git commit -m "Auto-sync NorthPoint README"
            git push
          else
            echo "README unchanged, skipping commit and push"
          fi
