name: Sync Project READMEs and Deploy

concurrency:
  group: readme-sync-main
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "_includes/*.md"
      - "_projects/*.md"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------- Sync READMEs ----------------
      - name: Sync PlutoPoint README
        run: |
          curl -sL https://raw.githubusercontent.com/ProfessorShroom/PlutoPoint-Installer/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/plutopoint-readme.md

      - name: Sync NorthPoint README
        run: |
          curl -sL https://raw.githubusercontent.com/ProfessorShroom/NorthPoint-Installer/master/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/northpoint-readme.md

      - name: Sync Cardmarket Price Updater README
        run: |
          curl -sL https://raw.githubusercontent.com/ProfessorShroom/Cardmarket-Price-Updater/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/cardmarket-price-updater-readme.md

      - name: Sync Useful Scripts README
        run: |
          curl -sL https://raw.githubusercontent.com/ProfessorShroom/ProfessorShroom-Scripts/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            > _includes/useful-scripts-readme.md

      - name: Sync VentPuck README
        run: |
          curl -sL https://raw.githubusercontent.com/ProfessorShroom/VentPuck/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/ventpuck-readme.md

      # ---------------- Detect + Commit ----------------
      - name: Detect changes
        id: changes
        run: |
          git add _includes/*.md

          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether to build
        id: plan
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ] \
             || [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Find which READMEs changed
          changed=$(git diff --name-only --cached _includes/*.md)

          # Touch corresponding project files (force Jekyll rebuild only when needed)
          for file in $changed; do
            case "$file" in
              *plutopoint-readme.md)
                touch _projects/PlutoPoint_Installer.md ;;
              *northpoint-readme.md)
                touch _projects/NorthPoint_Installer.md ;;
              *cardmarket-price-updater-readme.md)
                touch _projects/Cardmarket_Price_Updater.md ;;
              *ventpuck-readme.md)
                touch _projects/VentPuck.md ;;
            esac
          done

          git add _projects/*.md
          git commit -m "Auto-sync project READMEs [skip ci]"

          # main can move while this runs (Prettier, sitemap, post scheduling and
          # image stripping all commit to it), so retry the rebase + push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push to main after 5 attempts"
          exit 1

      # ---------------- Build ----------------
      - name: Setup Ruby 💎
        if: steps.plan.outputs.build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python 🐍
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install and Build 🔧
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS 🧹
        if: steps.plan.outputs.build == 'true'
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      # ---------------- Deploy ----------------
      - name: Deploy 🚀
        id: deploy
        if: steps.plan.outputs.build == 'true'
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

      - name: Deploy retry 🔁
        if: steps.plan.outputs.build == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry) 🚀
        if: steps.plan.outputs.build == 'true' && steps.deploy.outcome == 'failure'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

      # ---------------- No-op log ----------------
      - name: Skip notice
        if: steps.plan.outputs.build != 'true'
        run: echo "No README changes – skipping build & deploy"
