name: Strip Image Metadata

on:
  push:
    branches:
      - main
    paths:
      - 'assets/img/**.png'
      - 'assets/img/**.jpg'
      - 'assets/img/**.jpeg'
      - 'assets/img/**.gif'
      - 'assets/img/**.webp'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  strip-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Run removeImgMetadata.sh
        run: |
          chmod +x _scripts/removeImgMetadata.sh
          ./_scripts/removeImgMetadata.sh

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Strip image metadata"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"