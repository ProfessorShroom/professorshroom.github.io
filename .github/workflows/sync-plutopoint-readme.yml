name: Sync PlutoPoint README

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Download README as UTF-8 and extract changelog
        run: |
          curl -L https://raw.githubusercontent.com/ProfessorShroom/PlutoPoint-Installer/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/plutopoint-readme.md

      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add _includes/plutopoint-readme.md

          if ! git diff --cached --quiet; then
            echo "README changed, forcing page rebuild"

            # Update a Liquid comment in the page to trigger rebuild
            COMMENT="{% comment %} rebuild trigger $(date +%s) {% endcomment %}"
            # Remove old comment if exists and append new one at the top
            sed -i '/{% comment %} rebuild trigger/d' _projects/PlutoPoint_Installer.md
            sed -i "1i $COMMENT" _projects/PlutoPoint_Installer.md

            git add _projects/PlutoPoint_Installer.md
            git commit -m "Auto-sync PlutoPoint README and trigger rebuild"
            git push
          else
            echo "README unchanged, skipping commit and push"
          fi