name: Sync PlutoPoint README and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "_includes/plutopoint-readme.md"
      - "_projects/PlutoPoint_Installer.md"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Download README changelog
        run: |
          curl -L https://raw.githubusercontent.com/ProfessorShroom/PlutoPoint-Installer/main/README.md \
            | iconv -f UTF-8 -t UTF-8 -c \
            | awk 'BEGIN{IGNORECASE=1} /Changelog/{flag=1; next} flag' \
            > _includes/plutopoint-readme.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add _includes/plutopoint-readme.md
          if ! git diff --cached --quiet; then
            touch _projects/PlutoPoint_Installer.md
            git add _projects/PlutoPoint_Installer.md
            git commit -m "Auto-sync PlutoPoint README"
            git push
          else
            echo "README unchanged, skipping commit"

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
